name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain and components named in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Fetch real-world models
        shell: bash
        run: bash tools/fetch-corpus.sh

      - name: Test real-world models
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p slicer-cli --test corpus -- --ignored

      - name: Slice reference models
        shell: bash
        run: |
          mkdir -p gcode
          for model in examples/*.stl corpus/3dbenchy/3dbenchy.stl; do
            cargo run --release --locked -p slicer-cli -- slice "$model" -o "gcode/$(basename "${model%.stl}").gcode"
          done

      # Time and peak memory per model, shown on the summary page of the run.
      - name: Benchmark
        if: matrix.os == 'ubuntu-latest'
        run: |
          {
            echo "| Model | Time [s] | Peak memory [MB] |"
            echo "|---|---|---|"
            for model in examples/*.stl corpus/3dbenchy/3dbenchy.stl; do
              /usr/bin/time -f "%e %M" -o time.txt target/release/spaghetti-slicer slice "$model" -o /tmp/bench.gcode > /dev/null
              read -r seconds kilobytes < time.txt
              echo "| $(basename "$model") | $seconds | $((kilobytes / 1024)) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: gcode-${{ matrix.os }}
          path: gcode/
          if-no-files-found: error
          retention-days: 7

  identical-output:
    name: Identical G-code on all platforms
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: gcode

      - name: Compare
        run: |
          sha256sum gcode/*/*.gcode
          for other in windows-latest macos-latest; do
            if ! diff -rq gcode/gcode-ubuntu-latest "gcode/gcode-$other"; then
              echo "::error::G-code from $other differs from ubuntu-latest"
              diff -r gcode/gcode-ubuntu-latest "gcode/gcode-$other" | head -n 40
              exit 1
            fi
          done

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t spaghetti-slicer .

      - name: Size and user
        run: |
          size=$(docker image inspect spaghetti-slicer --format '{{.Size}}')
          echo "Image size: $size bytes"
          test "$size" -le 52428800
          test "$(docker image inspect spaghetti-slicer --format '{{.Config.User}}')" = "65532:65532"

      - name: Slice through the API
        run: |
          docker run -d --name slicer -p 8080:8080 spaghetti-slicer
          for _ in $(seq 30); do curl -fs localhost:8080/health && break; sleep 1; done
          id=$(curl -fs -F model=@examples/gear_with_hub.stl localhost:8080/v1/jobs | jq -r .id)
          for _ in $(seq 60); do
            status=$(curl -fs "localhost:8080/v1/jobs/$id" | jq -r .status)
            [ "$status" = queued ] || [ "$status" = running ] || break
            sleep 1
          done
          test "$status" = done
          curl -fs "localhost:8080/v1/jobs/$id/gcode" -o api.gcode

      - name: Same G-code from the command line tool in the image
        run: |
          mkdir out && chmod 777 out
          docker run --rm -v "$PWD/examples:/models:ro" -v "$PWD/out:/out"             --entrypoint /spaghetti-slicer spaghetti-slicer             slice /models/gear_with_hub.stl -o /out/cli.gcode
          cmp api.gcode out/cli.gcode

      - name: Stops cleanly
        run: |
          docker stop slicer
          docker logs slicer
          test "$(docker inspect slicer --format '{{.State.ExitCode}}')" = 0
