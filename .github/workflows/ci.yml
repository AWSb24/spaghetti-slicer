name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain and components named in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Fetch real-world models
        shell: bash
        run: bash tools/fetch-corpus.sh

      - name: Test real-world models
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p slicer-cli --test corpus -- --ignored

      - name: Slice reference models
        shell: bash
        run: |
          mkdir -p gcode
          for model in examples/*.stl corpus/3dbenchy/3dbenchy.stl; do
            cargo run --release --locked -p slicer-cli -- slice "$model" -o "gcode/$(basename "${model%.stl}").gcode"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: gcode-${{ matrix.os }}
          path: gcode/
          if-no-files-found: error
          retention-days: 7

  identical-output:
    name: Identical G-code on all platforms
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: gcode

      - name: Compare
        run: |
          sha256sum gcode/*/*.gcode
          for other in windows-latest macos-latest; do
            if ! diff -rq gcode/gcode-ubuntu-latest "gcode/gcode-$other"; then
              echo "::error::G-code from $other differs from ubuntu-latest"
              diff -r gcode/gcode-ubuntu-latest "gcode/gcode-$other" | head -n 40
              exit 1
            fi
          done
