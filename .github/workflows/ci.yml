name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain and components named in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # The workspace includes the desktop UI (slicer-ui). Its window
      # libraries (X11, Wayland, OpenGL) are loaded at run time, so Linux
      # needs no extra packages to build and test it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Fetch real-world models
        shell: bash
        run: bash tools/fetch-corpus.sh

      - name: Fetch Thingi10K models
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/fetch-thingi10k.py

      - name: Test real-world models
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p slicer-cli --test corpus -- --ignored

      - name: Slice reference models
        shell: bash
        run: |
          mkdir -p gcode
          for model in examples/*.stl corpus/3dbenchy/3dbenchy.stl; do
            cargo run --release --locked -p slicer-cli -- slice "$model" -o "gcode/$(basename "${model%.stl}").gcode"
          done

      # Time and peak memory per model, shown on the summary page of the run.
      - name: Benchmark
        if: matrix.os == 'ubuntu-latest'
        run: |
          {
            echo "| Model | Time [s] | Peak memory [MB] |"
            echo "|---|---|---|"
            for model in examples/*.stl corpus/3dbenchy/3dbenchy.stl; do
              /usr/bin/time -f "%e %M" -o time.txt target/release/spaghetti-slicer slice "$model" -o /tmp/bench.gcode > /dev/null
              read -r seconds kilobytes < time.txt
              echo "| $(basename "$model") | $seconds | $((kilobytes / 1024)) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: gcode-${{ matrix.os }}
          path: gcode/
          if-no-files-found: error
          retention-days: 7

  identical-output:
    name: Identical G-code on all platforms
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: gcode

      - name: Compare
        run: |
          sha256sum gcode/*/*.gcode
          for other in windows-latest macos-latest; do
            if ! diff -rq gcode/gcode-ubuntu-latest "gcode/gcode-$other"; then
              echo "::error::G-code from $other differs from ubuntu-latest"
              diff -r gcode/gcode-ubuntu-latest "gcode/gcode-$other" | head -n 40
              exit 1
            fi
          done

  web:
    name: Browser app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain and wasm target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Clippy for the browser
        run: cargo clippy -p slicer-ui --target wasm32-unknown-unknown --all-targets --locked -- -D warnings

      # The command line tool must match the wasm-bindgen crate exactly.
      - name: Install wasm-bindgen
        env:
          RUSTFLAGS: ""
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build
        run: bash tools/build-web.sh web

      - name: Served by the server
        run: |
          cargo build --release --locked -p slicer-server
          SPAGHETTI_WEB_DIR=web SPAGHETTI_LISTEN=127.0.0.1:8080 target/release/spaghetti-slicer-server &
          for _ in $(seq 30); do curl -fs localhost:8080/health && break; sleep 1; done
          curl -fs localhost:8080/app/ | grep -q 'id="slicer"'
          curl -fsI localhost:8080/app/slicer_bg.wasm | grep -qi 'content-type: application/wasm'
          # Module workers are only started with a JavaScript type.
          curl -fsI localhost:8080/app/worker.js | grep -qi 'content-type: text/javascript'
          ls -l web

      - uses: actions/upload-artifact@v7
        with:
          name: web-app
          path: web/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t spaghetti-slicer .

      - name: Size and user
        run: |
          size=$(docker image inspect spaghetti-slicer --format '{{.Size}}')
          echo "Image size: $size bytes"
          test "$size" -le 52428800
          test "$(docker image inspect spaghetti-slicer --format '{{.Config.User}}')" = "65532:65532"

      - name: Slice through the API
        run: |
          docker run -d --name slicer -p 8080:8080 spaghetti-slicer
          for _ in $(seq 30); do curl -fs localhost:8080/health && break; sleep 1; done
          id=$(curl -fs -F model=@examples/gear_with_hub.stl localhost:8080/v1/jobs | jq -r .id)
          for _ in $(seq 60); do
            status=$(curl -fs "localhost:8080/v1/jobs/$id" | jq -r .status)
            [ "$status" = queued ] || [ "$status" = running ] || break
            sleep 1
          done
          test "$status" = done
          curl -fs "localhost:8080/v1/jobs/$id/gcode" -o api.gcode

      - name: Same G-code from the command line tool in the image
        run: |
          mkdir out && chmod 777 out
          docker run --rm -v "$PWD/examples:/models:ro" -v "$PWD/out:/out"             --entrypoint /spaghetti-slicer spaghetti-slicer             slice /models/gear_with_hub.stl -o /out/cli.gcode
          cmp api.gcode out/cli.gcode

      - name: Stops cleanly
        run: |
          docker stop slicer
          docker logs slicer
          test "$(docker inspect slicer --format '{{.State.ExitCode}}')" = 0
