[package]
name = "slicer-server"
description = "HTTP API server for the slicer."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true
[[bin]]
name = "spaghetti-slicer-server"
path = "src/main.rs"

[dependencies]
slicer-core.workspace = true
slicer-fdm.workspace = true
slicer-gcode.workspace = true
slicer-formats.workspace = true
slicer-profiles.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "multipart", "tokio"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros"] }
uuid = { version = "1.29.2", default-features = false, features = ["v4"] }
serde_json = "1.0.154"

[dev-dependencies]
tower = { version = "0.5.3", default-features = false, features = ["util"] }
