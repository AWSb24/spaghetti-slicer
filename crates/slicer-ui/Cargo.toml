[package]
name = "slicer-ui"
description = "Desktop user interface for the slicer."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# The workspace lints, except that `unsafe_code` is "deny" instead of
# "forbid": the OpenGL calls of the 3D view (src/view3d.rs, glow) are
# unsafe and allowed in that one module only.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[[bin]]
name = "spaghetti-slicer-ui"
path = "src/main.rs"

[dependencies]
slicer-core.workspace = true
slicer-fdm.workspace = true
slicer-gcode.workspace = true
slicer-formats.workspace = true
slicer-profiles.workspace = true
# The project file's own part (TOML); both are already used by
# slicer-profiles.
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
# OpenGL renderer: much less to compile than wgpu and enough for drawing
# lines. `persistence` keeps the setup assistant's choice and the settings
# files in use between runs (in the browser: local storage). X11 and Wayland libraries are loaded at run time, so building on
# Linux needs no system packages.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "persistence", "x11", "wayland"] }
# File dialogs: native on Windows and macOS, the desktop portal over D-Bus on
# Linux (no GTK needed).
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
# A clock that also works in the browser (the std one panics there); on the
# desktop it is the std one.
web-time = "1.1.0"

# The browser build (`tools/build-web.sh`): eframe's web runner, files read
# and saved through the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["Blob", "BlobPropertyBag", "console", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "Url", "Window"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Load libwayland at run time instead of linking it (eframe leaves winit's
# default features off).
winit = { version = "0.30.13", default-features = false, features = ["wayland-dlopen"] }
