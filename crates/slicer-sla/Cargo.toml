[package]
name = "slicer-sla"
description = "Resin (MSLA) pipeline: layer images and an openly documented print archive."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true
[dependencies]
crc32fast = "1.5.5"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slicer-core.workspace = true
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
