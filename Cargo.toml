[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/AWSb24/spaghetti-slicer"

[workspace.dependencies]
slicer-core = { path = "crates/slicer-core" }
slicer-fdm = { path = "crates/slicer-fdm" }
slicer-gcode = { path = "crates/slicer-gcode" }
slicer-formats = { path = "crates/slicer-formats" }
slicer-profiles = { path = "crates/slicer-profiles" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
