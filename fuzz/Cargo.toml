# Fuzz targets for the importers; run with cargo-fuzz on a nightly toolchain:
#   cargo +nightly fuzz run stl
[package]
name = "spaghetti-slicer-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
slicer-core = { path = "../crates/slicer-core" }
slicer-formats = { path = "../crates/slicer-formats" }

[[bin]]
name = "stl"
path = "fuzz_targets/stl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "threemf"
path = "fuzz_targets/threemf.rs"
test = false
doc = false
bench = false

# Not part of the main workspace: it needs a nightly toolchain.
[workspace]
